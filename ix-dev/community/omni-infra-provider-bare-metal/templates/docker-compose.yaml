{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.bare_metal_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": 0, "gid": 0, "mode": "check"} %}

{% do c1.healthcheck.disable() %}

{% if values.network.host_network %}
  {% do c1.set_network_mode("host") %}
{% endif %}

{% do c1.environment.add_env("OMNI_ENDPOINT", values.omni.endpoint) %}
{% do c1.environment.add_env("OMNI_SERVICE_ACCOUNT_KEY", values.omni.service_account_key) %}
{% do c1.environment.add_user_envs(values.omni.additional_envs) %}

{% set cmd = namespace(x=[
  "--id=" ~ values.omni.provider_id,
  "--provider-name=" ~ values.omni.provider_name,
  "--provider-description=" ~ values.omni.provider_description,
  "--image-factory-base-url=" ~ values.image_factory.base_url,
  "--image-factory-pxe-base-url=" ~ values.image_factory.pxe_base_url,
  "--agent-mode-talos-version=" ~ values.image_factory.agent_mode_talos_version,
  "--boot-from-disk-method=" ~ values.boot.from_disk_method,
  "--ipmi-pxe-boot-mode=" ~ values.boot.ipmi_pxe_boot_mode,
  "--min-reboot-interval=" ~ values.advanced.min_reboot_interval,
  "--redfish-port=" ~ values.redfish.port,
]) %}

{% if values.omni.insecure_skip_verify %}{% do cmd.x.append("--insecure-skip-tls-verify") %}{% endif %}

{% if values.api.advertise_address %}{% do cmd.x.append("--api-advertise-address=" ~ values.api.advertise_address) %}{% endif %}
{% if values.api.listen_address %}{% do cmd.x.append("--api-listen-address=" ~ values.api.listen_address) %}{% endif %}
{% do cmd.x.append("--api-port=" ~ values.network.api_port.port_number) %}

{% if values.image_factory.use_local_boot_assets %}{% do cmd.x.append("--use-local-boot-assets") %}{% endif %}

{% if values.dhcp.disable_proxy %}{% do cmd.x.append("--disable-dhcp-proxy") %}{% endif %}
{% if values.dhcp.disable_broadcast %}{% do cmd.x.append("--disable-dhcp-proxy-broadcast") %}{% endif %}
{% if values.dhcp.iface_or_ip %}{% do cmd.x.append("--dhcp-proxy-iface-or-ip=" ~ values.dhcp.iface_or_ip) %}{% endif %}

{% if values.boot.secure_boot_enabled %}{% do cmd.x.append("--secure-boot-enabled") %}{% endif %}

{% if values.redfish.use_always %}{% do cmd.x.append("--redfish-use-always") %}{% endif %}
{% if values.redfish.use_when_available %}{% do cmd.x.append("--redfish-use-when-available") %}{% endif %}
{% if values.redfish.use_https %}{% do cmd.x.append("--redfish-use-https") %}{% endif %}
{% if values.redfish.insecure_skip_tls_verify %}{% do cmd.x.append("--redfish-insecure-skip-tls-verify") %}{% endif %}
{% if values.redfish.set_boot_source_override_mode %}{% do cmd.x.append("--redfish-set-boot-source-override-mode") %}{% endif %}

{% if values.tls.enabled %}{% do cmd.x.append("--tls-enabled") %}{% endif %}
{% if values.tls.agent_skip_verify %}{% do cmd.x.append("--tls-agent-skip-verify") %}{% endif %}

{% if values.advanced.wipe_with_zeroes %}{% do cmd.x.append("--wipe-with-zeroes") %}{% endif %}
{% if values.advanced.enable_resource_cache %}{% do cmd.x.append("--enable-resource-cache") %}{% endif %}
{% if values.advanced.debug %}{% do cmd.x.append("--debug") %}{% endif %}

{% if values.advanced.machine_labels %}
  {% do cmd.x.append("--machine-labels=" ~ values.advanced.machine_labels | join(",")) %}
{% endif %}

{% do c1.set_command(cmd.x) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{{ tpl.render() | tojson }}
